[project]
name = "mercadona-mcp"
version = "0.1.1"
description = "Unofficial, privacy-first MCP companion for Mercadona Online."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "MercadonaMCP contributors" }]
dependencies = [
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "mcp[cli]>=1.26,<2",
    "playwright>=1.58,<2",
    "pydantic>=2.12,<3",
    "typer>=0.21,<1",
]

[project.scripts]
mercadona = "mercadona_mcp.cli:app"
mercadona-mcp = "mercadona_mcp.mcp.server:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9.0,<10",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_unused_configs = true
